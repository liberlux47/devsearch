{% extends 'main.html' %}

{% block content %}

{% if project.featured_image %}
<img style="max-width: 100px" src="{{ project.featured_image.url }}">
{% endif %}

<h1>{{project.title}}</h1>
{% for tag in project.tags.all %}
<span style="border: 1px solid grey">{{tag}}</span>
{% endfor %}
<hr>
<p>{{project.description}}</p>
{% endblock %}
